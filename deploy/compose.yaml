# The provider node, as the installer sets it up in /opt/den-node (ADR-0002, ARCHITECTURE §4).
# Outbound only: no published ports. Secrets are files under ./secrets (root:65532 0750, each
# file 65532:65532 0400), never environment variables.
name: den-node

services:
  den-node:
    image: ${DEN_NODE_IMAGE:-den-node}:${DEN_NODE_VERSION:?}${DEN_NODE_TAG_SUFFIX:-}
    restart: unless-stopped
    mem_limit: 256m # the node uses about 10 MiB; a ceiling protects shared servers
    pids_limit: 128
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    environment:
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-}
      DEN_LANG: ${DEN_LANG:-en} # the language of the node's CLI, errors and OpenAPI texts: en or es
    volumes:
      - den-node-state:/var/lib/den-node
      - ./config:/etc/den-node:ro
      - ./secrets:/run/secrets:ro
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: '5' }

volumes:
  den-node-state: {}
