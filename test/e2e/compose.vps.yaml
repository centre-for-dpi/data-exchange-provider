# The canal node against the deployed portal: it reaches the portal, the gateway and the hub over
# the internet only. "api-propia" stands in for the entity's own internal API.
name: den-kit-e2e-vps

services:
  den-node:
    image: den-node:${DEN_NODE_VERSION:-0.1.0-dev}-canal
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    environment:
      DEN_HEARTBEAT_SECONDS: '15'
    volumes:
      - den-node-state:/var/lib/den-node
      - ./config-vps:/etc/den-node:ro
    secrets: [enrollment_token]
    depends_on: [api-propia]

  api-propia:
    image: den/mock-providers:dev
    environment:
      PROVIDER: salud
      PORT: '8000'

secrets:
  enrollment_token:
    file: ./.run/enrollment_token

volumes:
  den-node-state: {}
