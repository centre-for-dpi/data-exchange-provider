# The node as an entity runs it, in canal mode: no capabilities, read-only filesystem, non-root,
# no published ports; outbound only. Joins the portal's development stack (network den_providers).
name: den-kit-e2e

services:
  den-node:
    image: den-node:${DEN_NODE_VERSION:-0.1.0-dev}-canal
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    environment:
      DEN_HEARTBEAT_SECONDS: '15'
    volumes:
      - den-node-state:/var/lib/den-node
      - ./config:/etc/den-node:ro
    secrets: [enrollment_token]
    networks: [den_providers]

secrets:
  enrollment_token:
    file: ./.run/enrollment_token

networks:
  den_providers:
    external: true

volumes:
  den-node-state: {}
