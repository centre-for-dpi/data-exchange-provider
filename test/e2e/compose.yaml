# The node as an entity runs it, in canal mode: no capabilities, read-only filesystem, non-root,
# no published ports; outbound only. Joins the portal's development stack (network rid_providers).
name: rid-kit-e2e

services:
  rid-node:
    image: rid-node:${RID_NODE_VERSION:-0.1.0-dev}-canal
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    environment:
      RID_HEARTBEAT_SECONDS: '15'
    volumes:
      - rid-node-state:/var/lib/rid-node
      - ./config:/etc/rid-node:ro
    secrets: [enrollment_token]
    networks: [rid_providers]

secrets:
  enrollment_token:
    file: ./.run/enrollment_token

networks:
  rid_providers:
    external: true

volumes:
  rid-node-state: {}
